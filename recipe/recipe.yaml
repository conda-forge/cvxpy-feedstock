context:
  version: "1.9.3"

recipe:
  name: cvxpy-split
  version: ${{ version }}

source:
  - url: https://github.com/cvxpy/cvxpy/archive/refs/tags/v${{ version }}.tar.gz
    sha256: c75139161c01116ce4b17d25483ece2c98b3ec93ffd4bf7ba5776de971373514
    patches:
      # test that fails due to timing issues on slow CI agents when in emulation
      - patches/0001-loosen-time-limit-in-test_scipy_mi_time_limit_reache.patch
      # hypothesis deadline is flaky on osx_64 with Python 3.13
      - patches/0002-disable-deadline-for-test_nd_bool_index.patch

build:
  number: 0
  skip:
    - match(python, "<3.11")

outputs:
  - package:
      name: cvxpy-base
      version: ${{ version }}
    build:
      script:
        # if not in release mode, this may lead to issues, see
        # https://github.com/cvxpy/cvxpy/issues/1690
        - if: unix
          then:
            - export CXXFLAGS="${CXXFLAGS} -DNDEBUG"
            - rm $SRC_DIR/pyproject.toml
          else:
            - del %SRC_DIR%\pyproject.toml
        - python -m pip install . --no-deps --no-build-isolation -vvv
    requirements:
      build:
        - if: build_platform != target_platform
          then:
            - python
            - cross-python_${{ target_platform }}
            - numpy
        - ${{ stdlib("c") }}
        - ${{ compiler("c") }}
        - ${{ compiler("cxx") }}
      host:
        - python
        - pybind11
        - numpy
        - pip
        - setuptools
      run:
        - python
        - scipy >=1.13.0
        - qdldl-python >= 0.1.7.post5
        # default run-export of numpy is too loose (>=1.23,<3); cvxpy really needs >=2
        - numpy >=2
    tests:
      - python:
          imports:
            # public interface is defined (see #75) to be the content of
            # https://github.com/cvxpy/cvxpy/blob/master/cvxpy/__init__.py
            - cvxpy
      - package_contents:
          site_packages:
            # ensure that the package metadata did not mangle in the git hash
            - cvxpy-${{ version }}.dist-info/METADATA

  - package:
      name: cvxpy
      version: ${{ version }}
    requirements:
      host:
        - python
      run:
        - python
        - ${{ pin_subpackage('cvxpy-base', exact=True) }}
        - highspy >=1.14.0
        - osqp >=1.0.0
        - clarabel >=0.5
        - scs >=3.2.4
    tests:
      - python:
          imports:
            - cvxpy
            - cvxpy.cvxcore
            - cvxpy.cvxcore.python
      - requirements:
          run:
            - pip
            - pytest
            # issues with newer scipy and other libraries
            # - cvxopt
            - hypothesis
            - scipy
        files:
          source:
            - cvxpy/tests
        script:
          interpreter: python
          content:
            - 'import pytest'
            - 'import sys'
            - 'tests_to_skip = "_not_a_real_test"'
            # accuracy failure on PPC, likely due to emulation
            - if: ppc64le
              then:
                - 'tests_to_skip += " or (TestDqcp and test_basic_multiply)"'
            # hypothesis DeadlineExceeded; test's 200ms per-example deadline
            # is too tight for CI runners (seen on QEMU and osx_64)
            - 'tests_to_skip += " or test_nd_broadcast_generated"'
            # test that fails on Python 3.13
            - if: match(python, "==3.13")
              then:
                - 'tests_to_skip += " or test_sparsity_condition"'
            # diff-engine (NLP) tests need sparsediffpy, which is not packaged on conda-forge yet
            - 'sys.exit(pytest.main(["-v", "cvxpy/tests", "--ignore=cvxpy/tests/nlp_tests/stress_tests_diff_engine", "-k", f"not ({tests_to_skip})"]))'

about:
  homepage: http://www.cvxpy.org/
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  summary: A Python-embedded modeling language for convex optimization problems
  description: |
    CVXPY is a Python-embedded modeling language for convex optimization
    problems. It allows you to express your problem in a natural way that
    follows the math, rather than in the restrictive standard form required
    by solvers.
  documentation: http://www.cvxpy.org/
  repository: https://github.com/cvxpy/cvxpy

extra:
  recipe-maintainers:
    - timkpaine
    - PTNobel
    - SteveDiamond
    - akshayka
    - rileyjmurray
    - djsutherland
    - mcg1969
    - scopatz
    - h-vetinari
  feedstock-name: cvxpy
